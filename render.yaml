# Optional: the online game server on Render (Vercel can't host long-lived WebSockets).
# Set ALLOWED_ORIGINS to your Vercel URL, e.g. https://function-war.vercel.app
services:
  - type: web
    name: function-war-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
